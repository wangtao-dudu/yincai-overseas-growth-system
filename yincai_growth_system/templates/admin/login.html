<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 银彩海外增长系统</title><link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}"></head><body class="login-page"><div class="login-shell"><section><div class="login-mark">银</div><span>银彩海外增长系统</span><h1>海外业务，不再散落在表格和聊天记录里。</h1><p>统一管理产品、客户、商机、样品、报价、订单和回款。</p></section><form method="post" class="login-card"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><h2>登录管理后台</h2>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<label>用户名<input name="username" autocomplete="username" required></label><label>密码<input type="password" name="password" autocomplete="current-password" required></label><button class="admin-button full">进入工作台</button><small>首次部署后请立即修改默认密码。</small></form></div></body></html>
