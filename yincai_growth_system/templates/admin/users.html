{% extends "admin/base.html" %}{% block page_title %}用户权限{% endblock %}{% block page_desc %}公司账号、岗位隔离和最小权限管理{% endblock %}{% block content %}<details class="create-box"><summary>＋ 新建系统用户</summary><form method="post" class="admin-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label>用户名<input name="username" required></label><label>初始密码<input type="password" name="password" minlength="10" required></label><label>岗位<select name="role"><option>海外负责人</option><option>销售</option><option>产品技术</option><option>质量</option><option>内容运营</option><option>财务</option><option>交付</option><option>管理员</option></select></label></div><button class="admin-button">创建用户</button></form></details><section class="panel"><div class="table-wrap"><table><thead><tr><th>用户名</th><th>岗位</th><th>创建时间</th><th>重置密码</th></tr></thead><tbody>{% for user in users %}<tr><td><b>{{ user.username }}</b></td><td>{{ user.role }}</td><td>{{ user.created_at }}</td><td><form method="post" action="{{ url_for('reset_password',user_id=user.id) }}" class="row-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="password" name="password" minlength="10" placeholder="输入新密码" required><button class="link-button">重置</button></form></td></tr>{% endfor %}</tbody></table></div></section>{% endblock %}
