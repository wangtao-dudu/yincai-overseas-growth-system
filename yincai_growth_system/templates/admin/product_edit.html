{% extends "admin/base.html" %}{% block page_title %}编辑产品{% endblock %}{% block page_desc %}{{ product.name }}{% endblock %}{% block content %}<form method="post" action="{{ url_for('generate_product_copy',product_id=product.id) }}" class="generate-copy"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="admin-button">自动生成产品介绍草稿</button></form><section class="panel"><form method="post" enctype="multipart/form-data" class="admin-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label>产品名称<input name="name" value="{{ product.name }}" required></label><label>分类<input name="category" value="{{ product.category or '' }}"></label><label>容量<input name="capacity" value="{{ product.capacity or '' }}"></label><label>材料<input name="material" value="{{ product.material or '' }}"></label><label>尺寸<input name="dimensions" value="{{ product.dimensions or '' }}"></label><label>最低采购量<input name="moq" value="{{ product.moq or '' }}"></label><label>样品时间<input name="sample_time" value="{{ product.sample_time or '' }}"></label><label>生产周期<input name="lead_time" value="{{ product.lead_time or '' }}"></label></div><label>产品摘要<textarea name="summary">{{ product.summary or '' }}</textarea></label><label>完整介绍<textarea name="description">{{ product.description or '' }}</textarea></label><div class="form-grid"><label>表面工艺<textarea name="decoration">{{ product.decoration or '' }}</textarea></label><label>环保介绍<textarea name="sustainability">{{ product.sustainability or '' }}</textarea></label><label>检测资料<textarea name="tests">{{ product.tests or '' }}</textarea></label><label>替换主图<input type="file" name="image" accept="image/*"></label><label>替换视频<input type="file" name="video" accept="video/*"></label></div><div class="checks"><label><input type="checkbox" name="featured" {% if product.featured %}checked{% endif %}> 主推产品</label><label><input type="checkbox" name="published" {% if product.published %}checked{% endif %}> 发布到海外网站</label></div><button class="admin-button">保存修改</button></form></section>{% endblock %}
